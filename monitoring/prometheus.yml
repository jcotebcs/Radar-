# Prometheus configuration for Radar Notes monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Radar Notes application
  - job_name: 'radar-notes'
    static_configs:
      - targets: ['radar-notes:3000']
    metrics_path: '/health'
    scrape_interval: 30s
    params:
      format: ['prometheus']

  # Node exporter for system metrics (if available)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Nginx metrics (if available)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']

  # Redis metrics (if available)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']