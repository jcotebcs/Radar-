version: '3.8'

services:
  # Main application
  radar-notes:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: radar-notes-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - COMPRESSION_ENABLED=true
      - STATIC_CACHE_ENABLED=true
      - HEALTH_CHECK_ENABLED=true
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
    networks:
      - radar-network
    depends_on:
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radar.rule=Host(`your-domain.com`)"
      - "traefik.http.routers.radar.tls=true"
      - "traefik.http.routers.radar.tls.certresolver=letsencrypt"

  # Load balancer with nginx
  nginx:
    image: nginx:alpine
    container_name: radar-notes-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/ssl/certs:ro
      - ./dist:/var/www/radar-notes/dist:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - radar-notes
    networks:
      - radar-network

  # Redis for session storage and caching
  redis:
    image: redis:7-alpine
    container_name: radar-notes-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - radar-network

  # Backup service
  backup:
    image: alpine:latest
    container_name: radar-notes-backup
    restart: unless-stopped
    volumes:
      - ./backups:/backups
      - ./data:/app/data:ro
      - ./scripts/backup.sh:/backup.sh:ro
    environment:
      - BACKUP_INTERVAL=24h
      - BACKUP_RETENTION_DAYS=30
    command: sh -c "while true; do sh /backup.sh; sleep ${BACKUP_INTERVAL:-24h}; done"
    networks:
      - radar-network

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: radar-notes-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - radar-network
    profiles:
      - monitoring

  # Grafana for monitoring dashboard (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: radar-notes-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - radar-network
    profiles:
      - monitoring

  # Log aggregation with Loki (optional)
  loki:
    image: grafana/loki:latest
    container_name: radar-notes-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - radar-network
    profiles:
      - monitoring

networks:
  radar-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local