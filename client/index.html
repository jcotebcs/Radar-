<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radar Notes</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>Radar Notes</h1>

  <div id="status" role="alert"></div>

  <section id="recorder">
    <h2>Audio Recorder</h2>
    <button id="recordBtn">Start Recording</button>
  </section>

  <section id="timer">
    <h2>Timer</h2>
    <label for="timerTitle" class="visually-hidden">Timer title</label>
    <input id="timerTitle" placeholder="Title">
    <label for="timerDuration" class="visually-hidden">Duration in seconds</label>
    <input id="timerDuration" type="number" placeholder="Duration (sec)">
    <button id="createTimer">Create</button>
    <div id="timerDisplay"></div>
    <button id="startTimer">Start</button>
    <button id="stopTimer">Stop</button>
    <button id="deleteTimer">Delete</button>
  </section>

  <section id="tally">
    <h2>Tally Counters</h2>
    <label for="tallyTitle" class="visually-hidden">Counter name</label>
    <input id="tallyTitle" placeholder="Counter name">
    <button id="addTally">Add</button>
    <ul id="tallyList"></ul>
  </section>

  <section id="license">
    <h2>Business License Lookup</h2>
    <label for="bizName" class="visually-hidden">Business name</label>
    <input id="bizName" placeholder="Business name">
    <label for="bizState" class="visually-hidden">State code</label>
    <input id="bizState" placeholder="State" maxlength="2">
    <button id="lookupLicense">Lookup</button>
    <pre id="licenseResult"></pre>
  </section>

  <section id="verify">
    <h2>Professional License Verification</h2>
    <label for="verifyNumber" class="visually-hidden">License number</label>
    <input id="verifyNumber" placeholder="License number">
    <label for="verifyState" class="visually-hidden">State code</label>
    <input id="verifyState" placeholder="State" maxlength="2">
    <button id="verifyLicense">Verify</button>
    <pre id="verifyResult"></pre>
  </section>

  <script src="/app.js"></script>
</body>
</html>
